kind = "web"
previewPath = "/"
title = "Robinhood Wallet Admin"
version = "1.0.0"
id = "artifacts/robinhood-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25103

[services.development]
run = "pnpm --filter @workspace/robinhood-admin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/robinhood-admin", "run", "build" ]
publicDir = "artifacts/robinhood-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25103"
BASE_PATH = "/"
